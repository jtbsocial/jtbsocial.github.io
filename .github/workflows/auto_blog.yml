name: 24/7 Auto Blog Cloud Publisher

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Blog Generator Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          BLOG_NAME: ${{ vars.BLOG_NAME || 'TechVibe Hub' }}
          BLOG_TAGLINE: ${{ vars.BLOG_TAGLINE || 'Latest Tech Insights & Smart Guides' }}
          BLOG_URL: ${{ vars.BLOG_URL || 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}' }}
        run: |
          python main.py --count 1

      - name: Commit and Push New Articles to Repo
        run: |
          git config --global user.name "AutoBlog Bot"
          git config --global user.email "bot@autoblog.internal"
          git add site/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-publish new AI article [skip ci]" && git push)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
